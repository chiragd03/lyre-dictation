name: Feature request
description: Suggest an idea or improvement for Lyre.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lyre to do?
      placeholder: It would help if Lyre could...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What problem does it solve, or what would it make easier?
    validations:
      required: false
